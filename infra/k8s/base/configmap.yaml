apiVersion: v1
kind: ConfigMap
metadata:
  name: algoforge-config
  namespace: algoforge-app
data:
  API_PORT: "4000"
  API_HOST: "0.0.0.0"
  WEB_ORIGIN: "http://web.algoforge.local"
  WEB_ORIGINS: "http://web.algoforge.local,http://localhost:3000,http://127.0.0.1:3000"
  NEXT_PUBLIC_API_URL: "http://api.algoforge.local"
  INTERNAL_API_URL: "http://api.algoforge-app.svc.cluster.local:4000"
  REDIS_URL: "redis://redis.algoforge-data.svc.cluster.local:6379"
  ORCHESTRATOR_INTERVAL_MS: "1000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: algoforge-judge-config
  namespace: algoforge-judge
data:
  REDIS_URL: "redis://redis.algoforge-data.svc.cluster.local:6379"
  WORKER_CONCURRENCY: "1"
