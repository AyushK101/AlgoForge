apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: algoforge-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: orchestrator
          image: algoforge-orchestrator:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: algoforge-config
            - secretRef:
                name: algoforge-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
