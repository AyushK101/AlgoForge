apiVersion: apps/v1
kind: Deployment
metadata:
  name: judge-worker
  namespace: algoforge-judge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: judge-worker
  template:
    metadata:
      labels:
        app: judge-worker
    spec:
      runtimeClassName: gvisor
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: judge-worker
          image: algoforge-worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: algoforge-judge-config
            - secretRef:
                name: algoforge-secrets
                optional: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
